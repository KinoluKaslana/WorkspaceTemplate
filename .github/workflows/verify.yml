name: Verify governance integrity

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check every policy clause is marked
        run: python3 scripts/mark_rules.py check AGENT_RULES.md

      - name: Verify file + clause integrity against the registry
        run: python3 scripts/verify_rules.py --workspace .
